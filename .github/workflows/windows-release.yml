name: Windows Release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle Playwright Chromium
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: npx playwright install chromium

      - name: Build Windows packages
        run: npm run build -- --win

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify bundled Chromium
        shell: pwsh
        run: |
          $browserRoot = "node_modules/playwright-core/.local-browsers"
          if (-not (Test-Path $browserRoot)) {
            throw "Playwright Chromium was not bundled: $browserRoot"
          }
          $chrome = Get-ChildItem -Path $browserRoot -Recurse -Filter chrome.exe | Select-Object -First 1
          if (-not $chrome) {
            throw "Bundled Chromium executable was not found."
          }
          Write-Host "Bundled Chromium: $($chrome.FullName)"

      - name: List release files
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Marketplace AutoPost Bot v${{ steps.package.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Marketplace AutoPost Bot Setup ${{ steps.package.outputs.version }}.exe
            dist/Marketplace AutoPost Bot Setup ${{ steps.package.outputs.version }}.exe.blockmap
            dist/Marketplace AutoPost Bot ${{ steps.package.outputs.version }}.exe
