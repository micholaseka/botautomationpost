name: Build Windows Installer (.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publikasikan ke GitHub Releases?"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get app version
        id: pkg
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Versi aplikasi: $ver"

      - name: Build Windows Installer (.exe dengan Chromium dibundel)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verifikasi file installer
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path dist/*.exe
          if (-not $installers) {
            Write-Error "Gagal: File installer .exe tidak ditemukan di folder dist/"
            exit 1
          }
          $installers | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "Installer siap: $($_.Name) ($sizeMB MB)"
          }

      - name: Upload Installer (.exe) ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarketplaceAutoPostBot-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish ke GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          name: ${{ format('Marketplace AutoPost Bot v{0}', steps.pkg.outputs.version) }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
